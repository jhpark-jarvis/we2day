[project]
name = "we2day-api"
version = "0.1.0"
description = "WE2DAY application API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cryptography>=46,<51",
  "fastapi>=0.135",
  "httpx>=0.28,<1",
  "pillow>=12,<13",
  "pydantic-settings>=2.13",
  "psycopg[binary]>=3.2,<4",
  "pywebpush>=2.1,<3",
  "supabase>=2.28",
  "uvicorn[standard]>=0.41",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/we2day_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
