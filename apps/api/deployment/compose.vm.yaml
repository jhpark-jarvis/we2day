# Standalone, image-only deployment; do not merge with the development compose.yaml.
# Copy to a private VM directory beside api.env, web.env, and a non-secret .env.
name: we2day

x-runtime: &runtime
  restart: unless-stopped
  init: true
  cpus: 0.75
  pids_limit: 128
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "2"

services:
  reminder-worker:
    <<: *runtime
    profiles: [reminders]
    image: '${WE2DAY_API_IMAGE:?Set a reviewed release tag, digest, or local image ID}'
    pull_policy: never
    restart: "no"
    command: [python, -m, we2day_api.reminder_worker]
    env_file:
      - path: ./worker.env
        format: raw
    mem_limit: 96m
    memswap_limit: 128m
    cpus: 0.25
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    volumes:
      - type: bind
        source: ./supabase-ca.crt
        target: /run/we2day/supabase-ca.crt
        read_only: true
        bind:
          create_host_path: false
    networks: [backend]

  api:
    <<: *runtime
    image: '${WE2DAY_API_IMAGE:?Set a reviewed release tag, digest, or local image ID}'
    pull_policy: never
    env_file:
      - path: ./api.env
        format: raw
    environment:
      WE2DAY_CORS_ORIGINS: '${WE2DAY_ALLOWED_ORIGINS:?Set exact site origin JSON}'
    mem_limit: 192m
    memswap_limit: 320m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [backend]

  web:
    <<: *runtime
    image: '${WE2DAY_WEB_IMAGE:?Set a reviewed release tag, digest, or local image ID}'
    pull_policy: never
    env_file:
      - path: ./web.env
        format: raw
    environment:
      WE2DAY_SITE_URL: '${WE2DAY_SITE_ORIGIN:?Set site origin; HTTPS required for public use}'
      WE2DAY_API_URL: http://api:8000
      NODE_OPTIONS: --max-old-space-size=128
    ports:
      - '127.0.0.1:${WE2DAY_WEB_PORT:-3200}:3000'
    mem_limit: 256m
    memswap_limit: 384m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login',{redirect:'manual',signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [backend]

networks:
  backend: {}
