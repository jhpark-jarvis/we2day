# Replace we2day.example throughout; install only after certificate issuance.
# Standalone config, not an include in another site's nginx.conf.
user www-data;
worker_processes 1;
pid /run/we2day-proxy/nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 2m;
    client_body_temp_path /run/we2day-proxy/client-body;

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name we2day.example;
        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/we2day-acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 308 https://we2day.example$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }
    server {
        listen 443 ssl;
        server_name we2day.example;
        ssl_certificate /etc/letsencrypt/live/we2day.example/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/we2day.example/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:WE2DAY:1m;
        ssl_session_tickets off;

        location / {
            proxy_pass http://127.0.0.1:3200;
            proxy_http_version 1.1;
            proxy_set_header Host we2day.example;
            proxy_set_header X-Forwarded-Host we2day.example;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_hide_header X-Powered-By;
        }
    }
}
