# Replace we2day.example with the selected domain. HTTP serves ACME only.
# Standalone config, not an include in another site's nginx.conf.
user www-data;
worker_processes 1;
pid /run/we2day-proxy/nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    server_tokens off;
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name we2day.example;
        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/we2day-acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
